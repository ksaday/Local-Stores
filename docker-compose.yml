# Local development and CI services (plan §7.1, §14.2).
#
# By default only the backing services — Postgres and Redis — not the API and
# web apps. Those run on the host with hot reload, which is what you want while
# writing code; containerising them would mean a rebuild per change and buy
# nothing locally. CI needs exactly these two, disposable.
#
#   docker compose up -d
#   cd apps/api && npx prisma migrate deploy && npm run seed:dev
#
# The three application services below are behind the `apps` profile, so they
# start only when asked for and the command above is unchanged. They exist to
# run the real images — the same ones ECS runs — when what you are checking is
# the image rather than the code:
#
#   docker compose --profile apps up --build
#
# The `bba_app` role and every extension are created by migration
# 00000000000001, so a fresh container needs no init scripts — `migrate deploy`
# against an empty database is the whole setup.

services:
  postgres:
    # Pinned to the minor version rather than `16` or `latest`: an RLS or
    # planner change between minors would appear as a mysteriously failing
    # isolation test rather than as an upgrade anyone chose.
    image: postgres:16.11-alpine
    container_name: bba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bba_dev
      # Trust auth on a container bound to localhost only. This is a
      # development database that holds nothing real; a password here would be
      # committed to the repo, which is worse than not having one.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      # If you already run Homebrew Postgres, this clashes on 5432. Stop the
      # service (`brew services stop postgresql@16`) or change the host side.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns success while the server is still replaying WAL on
      # first boot, so the query is what actually proves it can serve.
      test: ["CMD-SHELL", "psql -U postgres -d bba_dev -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: bba-redis
    restart: unless-stopped
    # Persistence on, which it did not used to be. Redis was a cache and a
    # pub/sub relay — losing it cost a redelivery, never data, because the
    # durable copy of every order event is the outbox table (§12.8). It now
    # also holds the notifications queue, and a queued email has no copy
    # anywhere else: dropping it means a password reset or a suspension warning
    # that simply never arrives.
    #
    # AOF rather than RDB snapshots, because the window matters more than the
    # disk cost: `everysec` risks a second of jobs, a snapshot risks minutes.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # ── The real images, behind a profile ──────────────────────────────────────
  # api and worker are one image with two commands. See apps/api/Dockerfile for
  # why: two builds are two chances to run a worker whose code differs from the
  # API that enqueues its work, and that divergence is silent.
  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://bba_app@postgres:5432/bba_dev?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      LOG_FORMAT: json
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker/main.js"]
    environment:
      DATABASE_URL: postgresql://bba_app@postgres:5432/bba_dev?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      LOG_FORMAT: json
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # The service name, not localhost: inside the network the API is a
      # different host, and localhost would be this container talking to itself.
      API_ORIGIN: http://api:3001
      NODE_ENV: production
    ports:
      - "3100:3000"
    depends_on:
      - api

volumes:
  postgres-data:
    name: bba-postgres-data
  redis-data:
    name: bba-redis-data
